<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Stopwatch</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background-color: #f9f4ff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .stopwatch {
        text-align: center;
        background: white;
        border: 3px solid #6e27b0;
        border-radius: 20px;
        padding: 30px 40px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      .stopwatch h1 {
        font-size: 4rem;
        color: #541b9a;
        margin-bottom: 10px;
      }

      .stopwatch h2 {
        font-size: 1.5rem;
        color: #7b27b0;
        margin-bottom: 30px;
      }

      button {
        margin: 10px;
        padding: 10px 20px;
        font-size: 1rem;
        border-radius: 8px;
        border: none;
        color: white;
        background-color: #6527b0;
        cursor: pointer;
        transition: background 0.3s;
      }

      button:hover {
        background-color: #561fa2;
      }

      ul {
        list-style: none;
        padding: 0;
        margin-top: 20px;
      }

      li {
        background-color: #eee5f5;
        margin: 5px 0;
        padding: 8px 15px;
        border-radius: 10px;
        color: #4a148c;
        font-weight: bold;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Componente del Stopwatch -->
    <script type="text/babel" src="./stopwatch.js"></script>
  </body>
</html>
